<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RegAI Copilot{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.0" defer></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; min-height: 100vh; background: #f8f9fa; color: #1a1a1a; }
        .sidebar { width: 240px; background: #111827; color: #e5e7eb; padding: 1rem 0; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 0 1.5rem 1rem; font-size: 1.125rem; font-weight: 600; color: #fff; border-bottom: 1px solid #374151; }
        .sidebar nav { flex: 1; padding: 1rem 0; }
        .sidebar a { display: block; padding: 0.5rem 1.5rem; color: #d1d5db; text-decoration: none; }
        .sidebar a:hover { background: #1f2937; color: #fff; }
        .sidebar .active { background: #1f2937; color: #fff; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .topbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0.75rem 1.5rem; display: flex; justify-content: flex-end; align-items: center; }
        .topbar a { color: #6b7280; text-decoration: none; margin-left: 1rem; font-size: 0.875rem; }
        .content { padding: 1.5rem; flex: 1; }
        .banner { padding: 0.75rem 1rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .banner-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .banner-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .banner-info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.25rem; margin-bottom: 0.75rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { font-weight: 600; font-size: 0.875rem; color: #6b7280; }
        .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 0.375rem; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 0.875rem; text-decoration: none; }
        .btn:hover { background: #f3f4f6; }
        .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">RegAI Copilot</div>
        <nav>
            <a href="/app">Search</a>
            <a href="/app/assessments">Assessments</a>
            {% if user and user.role in ('manager', 'admin') %}
            <a href="/app/review">Review Queue</a>
            {% endif %}
            {% if user and user.role == 'admin' %}
            <a href="/admin">Admin</a>
            {% endif %}
        </nav>
    </aside>
    <div class="main">
        <header class="topbar">
            {% if user %}
            <span style="font-size:0.875rem;color:#6b7280;">{{ user.email }}</span>
            <form action="/auth/logout" method="post" style="display:inline;">
                <button type="submit" class="btn" style="border:none;background:none;color:#6b7280;cursor:pointer;">Logout</button>
            </form>
            {% endif %}
        </header>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
